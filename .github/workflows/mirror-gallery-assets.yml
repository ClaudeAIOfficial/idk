name: Mirror public gallery assets
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_media.py'
      - '.github/workflows/mirror-gallery-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Fetch official gallery assets
        run: python scripts/fetch_media.py
      - name: Commit downloaded image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cache available gallery assets locally"
          git pull --rebase origin main
          git push
